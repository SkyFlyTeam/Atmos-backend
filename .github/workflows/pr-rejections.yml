name: PR Changes Requested Count

on:
  pull_request_review:
    types: [submitted]

jobs:
  changes_requested:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changes requested count
        id: count
        run: |
          PR_REVS=$(gh pr reviews ${{ github.event.pull_request.number }} --json state,author -q '[.[] | select(.state == "CHANGES_REQUESTED")]')
          CHANGES_COUNT=$(echo "$PR_REVS" | jq length)
          
          echo "Changes Requested: $CHANGES_COUNT"
          
          for rev in $(echo "$PR_REVS" | jq -r '.[] | .author.login'); do
            echo "$rev: $(( $(echo "$PR_REVS" | jq -r ".[] | select(.author.login == \"$rev\")" | jq length) )) changes requested"
          done
