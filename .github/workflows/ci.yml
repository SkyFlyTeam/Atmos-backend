name: CI

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # semanalmente aos domingos às 00:00 UTC (corresponde ao cronograma do Jira)

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Testes unitários
        run: npm run test:unit

  integration_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atmos_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    needs: unit_tests
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Testes de integração
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: atmos_test
          JWT_KEY: 123asd!@#
        run: npm run test:integration

  # Tempo de aprovação para mesclagem de PR (migrado de github-pr-times.yml)
  pr_times:
    name: PR Approval to Merge Time
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'closed'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and gh
        run: |
          sudo apt-get update && sudo apt-get install -y jq gh

      - name: Get PR timestamps
        id: pr
        run: |
          PR_CREATED=$(gh pr view ${{ github.event.pull_request.number }} --json createdAt -q ".createdAt")
          PR_MERGED=$(gh pr view ${{ github.event.pull_request.number }} --json mergedAt -q ".mergedAt")
          PR_APPROVED=$(gh pr reviews ${{ github.event.pull_request.number }} --json submittedAt,state -q "[.[] | select(.state == \"APPROVED\") | .submittedAt]" | head -n 1)

          echo "PR Created At: $PR_CREATED"
          echo "PR Merged At: $PR_MERGED"
          echo "PR Approved At: $PR_APPROVED"

          if [[ "$PR_APPROVED" != "" && "$PR_MERGED" != "" ]]; then
            APPROVAL_TO_MERGE=$(date -d "$PR_MERGED" +%s) - $(date -d "$PR_APPROVED" +%s)
            echo "Approval to Merge: $((APPROVAL_TO_MERGE / 60)) minutes" >> $GITHUB_ENV
          fi

      - name: Save PR approval-to-merge time
        run: |
          echo "Approval-to-Merge Time: ${{ env.APPROVAL_TO_MERGE }} minutes"

  # Contagem de alterações solicitadas em PR (migrado de pr-rejections.yml)
  pr_rejections:
    name: PR Changes Requested Count
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_review'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and gh
        run: |
          sudo apt-get update && sudo apt-get install -y jq gh

      - name: Get changes requested count
        id: count
        run: |
          PR_REVS=$(gh pr reviews ${{ github.event.pull_request.number }} --json state,author -q '[.[] | select(.state == "CHANGES_REQUESTED")]')
          CHANGES_COUNT=$(echo "$PR_REVS" | jq length)
          
          echo "Changes Requested: $CHANGES_COUNT"
          
          for rev in $(echo "$PR_REVS" | jq -r '.[] | .author.login'); do
            echo "$rev: $(( $(echo "$PR_REVS" | jq -r ".[] | select(.author.login == \"$rev\")" | jq length) )) changes requested"
          done

  # Tarefa de transições do Jira (migrada de jira-transitions.yml)
  jira_transitions:
    name: Jira Transition Times
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Get Jira transition times
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
        run: |
          node scripts/get-jira-transitions.js