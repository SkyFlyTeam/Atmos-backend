name: PR Approval to Merge Time

on:
  pull_request:
    types: [opened, reopened, synchronized, closed]

jobs:
  pr_times:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR timestamps
        id: pr
        run: |
          PR_CREATED=$(gh pr view ${{ github.event.pull_request.number }} --json createdAt -q ".createdAt")
          PR_MERGED=$(gh pr view ${{ github.event.pull_request.number }} --json mergedAt -q ".mergedAt")
          PR_APPROVED=$(gh pr reviews ${{ github.event.pull_request.number }} --json submittedAt,state -q "[.[] | select(.state == \"APPROVED\") | .submittedAt]" | head -n 1)

          echo "PR Created At: $PR_CREATED"
          echo "PR Merged At: $PR_MERGED"
          echo "PR Approved At: $PR_APPROVED"

          if [[ "$PR_APPROVED" != "" && "$PR_MERGED" != "" ]]; then
            APPROVAL_TO_MERGE=$(date -d "$PR_MERGED" +%s) - $(date -d "$PR_APPROVED" +%s)
            echo "Approval to Merge: $((APPROVAL_TO_MERGE / 60)) minutes" >> $GITHUB_ENV
          fi

      - name: Save PR approval-to-merge time
        run: |
          echo "Approval-to-Merge Time: ${{ env.APPROVAL_TO_MERGE }} minutes"
